<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenshot 3 - Phone to PC</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #1a1a2e; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        .phone-frame {
            width: 360px; height: 780px; background: #fff;
            border-radius: 40px; overflow: hidden; position: relative;
            border: 4px solid #333; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .status-bar {
            height: 30px; background: #7C3AED; display: flex; 
            justify-content: space-between; align-items: center;
            padding: 0 20px; color: white; font-size: 12px;
        }
        .chat-header {
            background: linear-gradient(135deg, #7C3AED, #9575CD);
            padding: 15px 20px; display: flex; align-items: center;
            gap: 12px; color: white;
        }
        .back-btn { font-size: 20px; cursor: pointer; }
        .chat-avatar {
            width: 40px; height: 40px; background: rgba(255,255,255,0.2);
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 20px;
        }
        .chat-info { flex: 1; }
        .chat-name { font-size: 15px; font-weight: bold; }
        .chat-status { font-size: 11px; opacity: 0.8; }
        .chat-messages {
            flex: 1; padding: 15px; height: 580px;
            background: #f5f5f5; overflow-y: auto;
        }
        .message {
            max-width: 75%; margin-bottom: 12px; padding: 10px 14px;
            border-radius: 15px; font-size: 13px; line-height: 1.5;
        }
        .message.sent {
            background: #7C3AED; color: white; margin-left: auto;
            border-bottom-left-radius: 5px;
        }
        .message.received {
            background: white; color: #333; margin-right: auto;
            border-bottom-right-radius: 5px; border: 1px solid #eee;
        }
        .file-message {
            background: white; border: 2px solid #7C3AED; border-radius: 15px;
            padding: 12px; max-width: 75%; margin-bottom: 12px;
        }
        .file-icon { font-size: 30px; margin-bottom: 6px; }
        .file-name { font-size: 12px; color: #333; font-weight: bold; }
        .file-size { font-size: 10px; color: #888; margin-top: 2px; }
        .progress-bar {
            width: 100%; height: 6px; background: #eee; border-radius: 3px;
            margin-top: 8px; overflow: hidden;
        }
        .progress-fill {
            width: 100%; height: 100%; background: #4CAF50; border-radius: 3px;
        }
        .progress-text {
            font-size: 10px; color: #4CAF50; margin-top: 4px; text-align: center;
        }
        .chat-input {
            height: 60px; background: white; display: flex;
            align-items: center; padding: 0 15px; gap: 10px;
            border-top: 1px solid #eee;
        }
        .input-field {
            flex: 1; background: #f5f5f5; border: none; border-radius: 20px;
            padding: 10px 15px; font-size: 13px; outline: none;
        }
        .send-btn {
            width: 40px; height: 40px; background: #7C3AED;
            border-radius: 50%; border: none; color: white;
            font-size: 18px; cursor: pointer;
        }
        .attach-btn {
            width: 40px; height: 40px; background: #f0f0f0;
            border-radius: 50%; border: none; font-size: 18px;
            cursor: pointer;
        }
        .watermark {
            position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%);
            background: rgba(124,58,237,0.9); color: white; padding: 6px 16px;
            border-radius: 15px; font-size: 11px; white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="status-bar">
            <span>۱۲:۳۲</span>
            <span>📱 FileTransferApp</span>
            <span>۹۵٪</span>
        </div>
        <div class="chat-header">
            <div class="back-btn">→</div>
            <div class="chat-avatar">🖥️</div>
            <div class="chat-info">
                <div class="chat-name">DESKTOP-PC</div>
                <div class="chat-status">Windows • آنلاین</div>
            </div>
        </div>
        <div class="chat-messages">
            <div class="message received">فایل‌های شما دریافت شد! ✅</div>
            
            <div class="file-message" style="border-radius: 15px 15px 5px 15px;">
                <div class="file-icon">📄</div>
                <div class="file-name">project_report.docx</div>
                <div class="file-size">2.8 MB</div>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <div class="progress-text">✓ تکمیل شد</div>
            </div>
            
            <div class="file-message" style="border-radius: 15px 15px 5px 15px;">
                <div class="file-icon">📊</div>
                <div class="file-name">presentation.pptx</div>
                <div class="file-size">15.3 MB</div>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <div class="progress-text">✓ تکمیل شد</div>
            </div>
            
            <div class="file-message" style="border-radius: 15px 15px 5px 15px;">
                <div class="file-icon">🎬</div>
                <div class="file-name">video_clip.mp4</div>
                <div class="file-size">85.6 MB</div>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <div class="progress-text">✓ تکمیل شد</div>
            </div>
            
            <div class="message sent">همه فایل‌ها فرستاده شد! 🎉</div>
            <div class="message received">عالیه، ممنونم! 👏</div>
        </div>
        
        <div class="watermark">انتقال فایل گوشی به کامپیوتر</div>
        
        <div class="chat-input">
            <button class="attach-btn">📎</button>
            <input type="text" class="input-field" placeholder="پیام...">
            <button class="send-btn">➤</button>
        </div>
    </div>
</body>
</html>
